spring:
  application:
    name: petmatch-lab
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/petmatch_lab}
    username: ${DB_USERNAME:petmatch_user}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

server:
  port: 8080