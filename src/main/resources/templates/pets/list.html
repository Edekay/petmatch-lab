<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Catálogo de Mascotas | PetMatch Mini')}"></head>

<body>
    <nav th:replace="~{fragments/navigation :: navigation}"></nav>

    <main class="page-container">
        <section class="content-panel">
            <h1>Mascotas del catálogo</h1>
            <p class="page-intro">Hay <strong th:text="${pets.size()}" style="color: #20c997;">3</strong> mascotas
                disponibles esperando por ti.</p>

            <div class="pets-grid">
                <div class="pet-card" th:each="pet : ${pets}">
                    <h3 th:text="${pet.name}">Nombre</h3>
                    <p><strong>Especie:</strong> <span th:text="${pet.species}">Especie</span></p>
                    <p><strong>Edad:</strong> <span th:text="${pet.age}">Edad</span> años</p>
                    <p th:text="${pet.description}">Descripción corta...</p>
                    <p style="margin-top: 15px;">
                        <a class="btn-details" th:href="@{/pets/{id}(id=${pet.id})}">Ver detalles</a>
                    </p>
                </div>
            </div>

            <a class="back-link" th:href="@{/}">← Volver al inicio</a>
        </section>
    </main>
</body>

</html>
